<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mampf Registrierung</title>

    <link href="bootstrap.min.css" rel="stylesheet">
    <!-- Oberflächenfarbe wie auf der Karte (Farbregler auf der About-Seite) -->
    <script src="/assets/theme.js"></script>

    <style>
        :root {
            --hue: 175.5;
            --primary: hsl(var(--hue) 53.8% 39%);
        }

        /* Logo in der Oberflächenfarbe: die Datei dient nur als Form (Maske) */
        .mampf-logo {
            display: block;
            width: 250px;
            aspect-ratio: 1700 / 750;
            background-color: var(--primary);
            -webkit-mask: url('logo.svg') center / contain no-repeat;
            mask: url('logo.svg') center / contain no-repeat;
        }

        html,
        body {
            height: 100%;
        }

        .form-register {
            max-width: 330px;
            padding: 1rem;
        }

        .form-register .form-floating:focus-within {
            z-index: 2;
        }

        #mail {
            margin-bottom: 10px;
		}
		
        #password {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        #password2 {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
    </style>
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="form-register w-100 m-auto text-center">
        <form onsubmit="onFormSubmit(event)">
            <!-- Logo mit Zufallsspruch (Sprüche: map/public/assets/slogans.txt) -->
            <div class="mb-3 mx-auto" style="width: 250px" data-mampf-slogan>
                <span class="mampf-logo" role="img" aria-label="mampf"></span>
            </div>
            <h1 class="h4 mb-3 fw-normal">Jetzt registrieren</h1>

            <div class="form-floating">
                <input type="email" class="form-control" id="mail" placeholder="name@example.com" maxlength="128" minlength="5" required>
                <label for="mail">E-Mail</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Passwort" maxlength="128" minlength="6" required>
                <label for="password">Passwort</label>
            </div>
			
			<div class="form-floating">
                <input type="password" class="form-control" id="password2" placeholder="Passwort" required>
                <label for="password2">Passwort bestätigen</label>
            </div>

            <button id="login-button" class="btn btn-primary w-100 py-2" type="submit">Registrieren</button>

            <div id="alert" class="alert alert-danger mt-3 text-start d-none" role="alert">
                Deine Registrierung ist fehlgeschlagen. Bitte versuche es erneut.
            </div>

            <p class="mt-5 mb-3 text-body-secondary">Bereits registriert? <a href="index.html">Jetzt anmelden</a></p>
        </form>
    </main>
    <script src="/assets/slogan.js"></script>
</body>

<script>
    function onFormSubmit(event) {
		event.preventDefault();
	
        changeAlertVisibility(false);

        const mail = document.getElementById('mail').value;
        const password = document.getElementById('password').value;
		const password2 = document.getElementById('password2').value;
		
		if (password !== password2) {
		  changeAlertVisibility(true);
		  return false;
		}

        fetch("../api/post-register.php", {
            method: "post",
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                mail, password
            })
        })
            .then(response => {
                if (response.ok) {
                    window.location.href = "index.html#register";
                } else {
                    changeAlertVisibility(true);
                }
            }).catch(_ => {
                changeAlertVisibility(true);
            });

        return false;
    }

    function changeAlertVisibility(visible) {
        const alert = document.getElementById('alert');
        if (visible) {
            alert.classList.remove("d-none");
        } else {
            alert.classList.add("d-none");
        }
    }
</script>

</html>
