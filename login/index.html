<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mampf Login</title>

    <link href="bootstrap.min.css" rel="stylesheet">
    <!-- Oberflächenfarbe wie auf der Karte (Farbregler auf der About-Seite) -->
    <script src="/assets/theme.js"></script>

    <style>
        :root {
            --hue: 175.5;
            --primary: hsl(var(--hue) 53.8% 39%);
        }

        /* Logo in der Oberflächenfarbe: die Datei dient nur als Form (Maske) */
        .mampf-logo {
            display: block;
            width: 250px;
            aspect-ratio: 1700 / 750;
            background-color: var(--primary);
            -webkit-mask: url('logo.svg') center / contain no-repeat;
            mask: url('logo.svg') center / contain no-repeat;
        }

        html,
        body {
            height: 100%;
        }

        .form-signin {
            max-width: 330px;
            padding: 1rem;
        }

        .form-signin .form-floating:focus-within {
            z-index: 2;
        }

        #mail {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        #password {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
    </style>
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="form-signin w-100 m-auto text-center">
        <form onsubmit="onFormSubmit(event)">
            <!-- Logo mit Zufallsspruch (Sprüche: map/public/assets/slogans.txt) -->
            <div class="mb-3 mx-auto" style="width: 250px" data-mampf-slogan>
                <span class="mampf-logo" role="img" aria-label="mampf"></span>
            </div>
            <h1 class="h4 mb-3 fw-normal">Bitte melde dich an</h1>

            <div class="form-floating">
                <input type="email" class="form-control" id="mail" placeholder="name@example.com" required>
                <label for="mail">E-Mail</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Passwort" required>
                <label for="password">Passwort</label>
            </div>

            <button id="login-button" class="btn btn-primary w-100 py-2" type="submit">Anmelden</button>

            <div id="alert-error" class="alert alert-danger mt-3 text-start d-none" role="alert">
                Dein Anmeldeversuch ist fehlgeschlagen. Bitte versuche es erneut.
            </div>
			
			<div id="alert-register" class="alert alert-success mt-3 text-start d-none" role="alert">
                Deine Registrierung war erfolgreich. Du kannst dich jetzt mit deinen Zugangsdaten anmelden.
            </div>
			
			<div id="alert-logout" class="alert alert-success mt-3 text-start d-none" role="alert">
                Du hast dich erfolgreich abgemeldet.
            </div>

            <p class="mt-5 mb-3 text-body-secondary">Noch kein Account? <a href="register.html" id="register-link">Jetzt registrieren</a></p>
        </form>
    </main>
    <script src="/assets/slogan.js"></script>
</body>

<script>
	const urlFragment = window.location.hash;
	// Kam von der Karte (z.B. zum Kommentieren)? Auch über die Registrierung mitnehmen.
	document.getElementById('register-link').href = 'register.html' + window.location.search;
	if (urlFragment === '#logout') {
		document.getElementById('alert-logout').classList.remove('d-none');
	} else if (urlFragment === '#register') {
		document.getElementById('alert-register').classList.remove('d-none');
	}

    function onFormSubmit(event) {
		event.preventDefault();
	
        changeErrorAlertVisibility(false);

        const mail = document.getElementById('mail').value;
        const password = document.getElementById('password').value;

        fetch("../api/post-login.php", {
            method: "post",
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                mail, password
            })
        })
            .then(response => {
                if (response.ok) {
                    // Von der Karte gekommen (z.B. zum Kommentieren): zurück zur Karte
                    const back = new URLSearchParams(window.location.search).get('zurueck');
                    window.location.href = back === 'karte' ? "../" : "../admin/";
                } else {
                    changeErrorAlertVisibility(true);
                }
            }).catch(_ => {
                changeErrorAlertVisibility(true);
            });

        return false;
    }

    function changeErrorAlertVisibility(visible) {
		document.getElementById('alert-logout').classList.add('d-none');
		document.getElementById('alert-register').classList.add('d-none');
	
        const alert = document.getElementById('alert-error');
        if (visible) {
            alert.classList.remove("d-none");
        } else {
            alert.classList.add("d-none");
        }
    }
</script>

</html>
