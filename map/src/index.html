<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>mampf – Foodtrucks und Imbisse auf der Karte</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta
      name="description"
      content="Foodtrucks, Imbisse und Take-aways auf einer Karte. Sieh auf einen Blick, wer heute offen hat." />

    <!-- Icons: SVG für Browser, PNG für iPhone (Teilen, Home-Bildschirm) -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2e9991" />
    <!-- Oberflächenfarbe (Farbregler auf der About-Seite) vor allem anderen setzen -->
    <script src="assets/theme.js"></script>
    <!--
      Kein Zoomen der ganzen Seite (nur die Karte selbst zoomt). iPhones
      ignorieren "user-scalable=0", darum zusätzlich die Zwei-Finger-Geste
      von Safari abfangen. Die Karte verarbeitet ihre Gesten selbst.
    -->
    <script>
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
        document.addEventListener(name, function (event) { event.preventDefault(); }, { passive: false });
      });
    </script>
    <meta name="apple-mobile-web-app-title" content="mampf" />

    <!-- Vorschau beim Teilen (WhatsApp, iMessage, Signal usw.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mampf.io/" />
    <meta property="og:title" content="mampf – Foodtrucks und Imbisse auf der Karte" />
    <meta
      property="og:description"
      content="Foodtrucks, Imbisse und Take-aways auf einer Karte. Sieh auf einen Blick, wer heute offen hat." />
    <!-- Bewusst das kleine Icon (180px): Unter 300px zeigen WhatsApp & Co. es als
         kleines Vorschaubild neben dem Text statt als riesiges Bild darüber. -->
    <meta property="og:image" content="https://mampf.io/apple-touch-icon.png" />
    <meta property="og:image:width" content="180" />
    <meta property="og:image:height" content="180" />

    <!--
      Splashscreen: animiertes Logo beim Laden, mit durchsichtigem Hintergrund
      (die Karte lädt dahinter). Am Ende der Animation werden aus "mampf" sieben
      Ringe, die genau über den Punkten MO–SO des Tages-Wählers liegen.

      Danach blendet der ganze Splash (Band und Logo) aus und gibt die fertige
      Leiste frei. Die frühere Variante (Band schrumpft in die Leiste, Punkte und
      Tageskreis erscheinen nacheinander) ist noch da: MORPH_INTO_BAR im Skript unten.

      Ausrichtung (Logo-Datei assets/logo-animated.svg, viewBox 1700 x 750):
      - Die Ringe liegen am Ende 220 Einheiten auseinander, die Tages-Punkte 47px.
        Skalierung also 47 / 220 = 0.213636 -> Logo 1700 * 0.213636 = 363.18px breit.
      - Der mittlere Ring (DO) liegt bei x = 833, y = 199 und muss auf den DO-Punkt:
        waagrecht in der Bildmitte, senkrecht 28.5px über der Unterkante des
        Tages-Wählers (57px hoch, Punkt-Mitte 28.5px unter seiner Oberkante).
      - left   = 50% - 833 * 0.213636 = 50% - 177.96px
      - bottom = --day-selector-bottom + 28.5px - (750 - 199) * 0.213636
               = --day-selector-bottom + 28.5px - 117.71px
      --day-selector-bottom steht in src/vars.scss (gilt für Wähler und Splash).
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        overflow: hidden;
        pointer-events: none; /* Karte bleibt bedienbar */
        transition: opacity var(--splash-fade, 700ms) ease;
      }
      /* Alte Variante (MORPH_INTO_BAR): Ringe landen genau auf den Punkten der Leiste */
      #splash.morph svg {
        bottom: calc(var(--day-selector-bottom, 40px) + 28.5px - 117.71px);
      }
      /* Am Ende blendet alles aus, die Leiste darunter ist schon fertig */
      #splash.fade-out {
        opacity: 0;
      }
      #splash svg {
        position: absolute;
        z-index: 1; /* vor dem Band */
        left: calc(50% - 177.96px);
        /* Neue Variante: feste Höhe, unabhängig von der Leiste (das Band verdeckt
           sie ohnehin). Spruch ca. 22px über dem Rand. */
        bottom: -2px;
        width: 363.18px;
        height: 160.23px;
        transition: opacity var(--logo-fade, 700ms) ease;
        color: var(--primary, #2e9991); /* Linien des Logos (currentColor) */
      }
      /* Neue Variante: Logo 15 % kleiner (0.85 * 363.18px), mittlerer Ring bleibt in der
         Bildmitte: left = 50% - 833 * (308.70 / 1700) = 50% - 151.27px.
         Die alte Variante (morph) braucht die genaue Grösse oben, damit die Ringe passen. */
      #splash:not(.morph) svg {
        left: calc(50% - 151.27px);
        bottom: 10px; /* etwas höher in der weissen Box (Oberkante 153px) */
        width: 308.7px;
        height: 136.2px;
      }
      /* Logo blendet aus, kurz nachdem die grauen Punkte einzublenden beginnen */
      #splash.fade-logo svg {
        opacity: 0;
      }
      /*
        Zufallsspruch unter dem Logo (assets/slogan.js). Sichtbar nur, solange das
        Logo ganz ist (bis 33 %) und das Band ihn noch verdeckt: Ab ca. 45 % liegt
        das schrumpfende Band nicht mehr hinter dem Spruch.
      */
      #splash .mampf-slogan {
        opacity: 0;
        animation: splash-slogan var(--splash-duration, 4.5s) linear forwards;
      }
      @keyframes splash-slogan {
        0% {
          opacity: 0;
        }
        8%,
        33% {
          opacity: 1;
        }
        40%,
        100% {
          opacity: 0;
        }
      }
      /*
        Ohne Animation (ANIMATE_LOGO = false): Das Logo bleibt auf seinem ersten
        Bild stehen (ganzes "mampf"), der Spruch blendet ein und bleibt.
      */
      #splash.static svg *:not(.mampf-slogan) {
        animation-play-state: paused !important;
      }
      #splash.static .mampf-slogan {
        animation: splash-slogan-in 400ms linear forwards;
      }
      @keyframes splash-slogan-in {
        to {
          opacity: 1;
        }
      }
      /*
        Weisses Band hinter dem Logo, von Anfang an mit runden Ecken wie der
        Tages-Wähler. Am Anfang ist es grösser als der Bildschirm (Ecken liegen
        ausserhalb), dann zieht es sich auf die Grösse des Tages-Wählers zusammen
        (339 x 57px). Zeiten relativ zur Logo-Animation (--splash-duration):
          0–8 %    Band blendet ein
          25–78 %  Band wird gleichzeitig flacher und schmaler, während sich die
                   Buchstaben in Ringe verwandeln (bei 83 % sind die Ringe fertig)
        Nachgerechnet: So schneidet das Band das Logo nie an (mind. 10px Abstand).
      */
      #splash-band {
        position: absolute;
        left: -40px;
        bottom: -40px;
        width: calc(100% + 80px);
        height: 193px; /* Oberkante 153px über dem Rand, knapp über dem Logo */
        border-radius: 28.5px;
        background-color: #ffffff;
        box-shadow: 0px 2px 5px 0px rgba(0, 0, 0, 0.2); /* wie die Leiste */
        opacity: 0;
      }
      #splash.play #splash-band {
        animation: splash-band-in var(--splash-duration, 4.5s) linear forwards;
      }
      /* Alte Variante (MORPH_INTO_BAR): Band schrumpft auf die Grösse der Leiste */
      #splash.morph.play #splash-band {
        animation:
          splash-band-in var(--splash-duration, 4.5s) linear forwards,
          splash-band-shrink var(--splash-duration, 4.5s) linear forwards;
      }
      @keyframes splash-band-in {
        0% {
          opacity: 0;
        }
        8%,
        100% {
          opacity: 1;
        }
      }
      @keyframes splash-band-shrink {
        0%,
        25% {
          left: -40px;
          bottom: -40px;
          width: calc(100% + 80px);
          height: 193px;
          animation-timing-function: cubic-bezier(0.42, 0, 0.58, 1);
        }
        78%,
        100% {
          left: calc(50% - 169.5px);
          bottom: var(--day-selector-bottom, 40px);
          width: 339px;
          height: 57px;
        }
      }
      /*
        Nur alte Variante (MORPH_INTO_BAR):
        Intro des Tages-Wählers nach dem Logo, gesteuert über Klassen auf <html>:
          intro          Leiste leer: keine Punkte, kein Tageskreis, kein Wochenende
          intro-hidden   Leiste ganz unsichtbar (solange das Band sie verdeckt)
          intro-dots     graue Punkte blenden ein
          intro-thumb    Kreis des aktuellen Tages wächst von klein auf
          intro-weekend  hellgraue Wochenend-Markierung blendet ein
        Die Dauern kommen aus dem Skript unten (--intro-...).
      */
      html.intro mampf-day-selector {
        transition: none !important; /* Austausch Band -> Leiste ohne Flackern */
      }
      html.intro-hidden mampf-day-selector {
        opacity: 0 !important;
      }
      /* Punkte über die Farbe einblenden (weiss -> grau), nicht über die Deckkraft:
         Eine Deckkraft-Animation legt die Punkte in manchen Browsern (Safari)
         kurz auf eine eigene Ebene über dem Tageskreis. */
      html.intro mampf-day-selector .day {
        background-color: var(--white, #ffffff);
        transition: background-color var(--intro-dots, 600ms) ease;
      }
      html.intro.intro-dots mampf-day-selector .day {
        background-color: var(--grey2, #b1b1b1);
      }
      html.intro mampf-day-selector .thumb {
        scale: 0;
        transition: scale var(--intro-thumb, 500ms) cubic-bezier(0.3, 1.4, 0.5, 1) !important;
      }
      html.intro.intro-thumb mampf-day-selector .thumb {
        scale: 1;
      }
      html.intro mampf-day-selector .wrapper-saturday,
      html.intro mampf-day-selector .wrapper-sunday {
        background-color: transparent;
        outline-color: transparent;
        transition:
          background-color var(--intro-weekend, 800ms) ease,
          outline-color var(--intro-weekend, 800ms) ease;
      }
      html.intro.intro-weekend mampf-day-selector .wrapper-saturday,
      html.intro.intro-weekend mampf-day-selector .wrapper-sunday {
        background-color: var(--grey1, #dedede);
        outline-color: var(--grey1, #dedede);
      }
      /* Schalter Mittag/Abend erscheint zusammen mit der Wochenend-Markierung */
      html.intro mampf-slot-selector {
        opacity: 0;
        transition: opacity var(--intro-weekend, 800ms) ease;
      }
      html.intro.intro-weekend mampf-slot-selector {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>

    <div id="splash"><div id="splash-band"></div></div>
    <script src="assets/slogan.js"></script>
    <script>
      (() => {
        /**
         * false = Logo erscheint mit Spruch, steht still und blendet nach STATIC_HOLD aus.
         * true  = Buchstaben verwandeln sich in die Ringe der Tagesleiste (Animation).
         * Vorerst ausgeschaltet.
         */
        const ANIMATE_LOGO = false;
        /** Nur ohne Animation: so lange bleibt das stehende Logo sichtbar, bevor es ausblendet. */
        const STATIC_HOLD = 2500;
        /** Dauer der Logo-Animation. Die Datei ist auf 3000 ms gebaut, hier etwas langsamer. */
        const DURATION = 4500;
        /**
         * true = alte Variante: Das Band schrumpft in die Leiste, danach erscheinen
         * Punkte, Tageskreis und Wochenende nacheinander.
         * false = Band bleibt gross, am Ende blendet alles aus und zeigt die Leiste.
         */
        const MORPH_INTO_BAR = false;
        /** Nur neue Variante: so lange nach den fertigen Ringen warten ... */
        const HOLD = 200;
        /** ... und so lange dauert das Ausblenden. */
        const SPLASH_FADE = 700;
        /** Das Band hat bei 78 % die Grösse des Tages-Wählers (siehe @keyframes splash-band-shrink). */
        const BAND_DONE = DURATION * 0.78;
        /** Die Ringe sind bei 83 % fertig. */
        const RINGS_DONE = DURATION * 0.83;
        /** Graue Punkte einblenden, sobald die Ringe fertig sind (sie passen genau in die Ringe). */
        const DOTS_FADE = 600;
        /** Logo beginnt so viel später auszublenden als die Punkte einzublenden ... */
        const LOGO_DELAY = 150;
        /** ... und braucht so lange dafür. */
        const LOGO_FADE = 500;
        /**
         * Der Kreis des aktuellen Tages wächst erst, wenn das Logo ganz weg ist:
         * Das Logo liegt über allem, sonst wäre der Ring über dem wachsenden Kreis.
         */
        const THUMB_DELAY = 0;
        const THUMB_GROW = 500;
        /** Minim nach dem Tageskreis blendet die Wochenend-Markierung langsam ein. */
        const WEEKEND_DELAY = 300;
        const WEEKEND_FADE = 1000;

        const splash = document.getElementById('splash');
        const html = document.documentElement;
        if (MORPH_INTO_BAR) {
          html.classList.add('intro', 'intro-hidden');
          splash.classList.add('morph');
        }
        splash.style.setProperty('--splash-fade', SPLASH_FADE + 'ms');
        splash.style.setProperty('--splash-duration', DURATION + 'ms');
        html.style.setProperty('--intro-dots', DOTS_FADE + 'ms');
        html.style.setProperty('--logo-fade', LOGO_FADE + 'ms');
        html.style.setProperty('--intro-thumb', THUMB_GROW + 'ms');
        html.style.setProperty('--intro-weekend', WEEKEND_FADE + 'ms');

        const at = (ms, step) => setTimeout(step, ms);

        const cleanUp = () => {
          splash.remove();
          html.classList.remove('intro', 'intro-hidden', 'intro-dots', 'intro-thumb', 'intro-weekend');
        };

        // Logo nur beim frischen Öffnen oder Neuladen der Karte zeigen, nicht
        // wenn man aus dem Admin-Bereich oder vom Login zurückkommt.
        const navigation = performance.getEntriesByType('navigation')[0];
        const reloaded = navigation?.type === 'reload';
        let fromOwnSite = false;
        try {
          fromOwnSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
        } catch {
          // ungültiger Referrer: wie von aussen
        }
        if (fromOwnSite && !reloaded) {
          cleanUp();
          return;
        }

        // Das Logo wird als Code in die Seite eingefügt (nicht als Bild):
        // So startet die Animation bei jedem Laden von vorn. Ein Bild würde der
        // Browser samt abgelaufener Animation aus dem Zwischenspeicher nehmen.
        fetch('assets/logo-animated.svg')
          .then(response => response.text())
          .then(svg => {
            // Ohne Animationswunsch (Bedienungshilfen) gleich die fertige Seite zeigen
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
              cleanUp();
              return;
            }
            svg = svg
              .replace(/stroke="#(000|000000|2e9991)"/g, 'stroke="currentColor"') // Linien in der Oberflächenfarbe
              .replace(/3000ms/g, DURATION + 'ms'); // Tempo anpassen
            splash.insertAdjacentHTML('beforeend', svg);
            splash.classList.add('play'); // Band-Animation gleichzeitig starten
            if (!ANIMATE_LOGO) splash.classList.add('static');

            // Zufallsspruch unter das Logo. Kommt er etwas später (Schrift lädt noch),
            // springt seine Animation an die richtige Stelle, damit er nicht zu lange bleibt.
            const started = performance.now();
            window.MampfSlogan?.attach(splash.querySelector('svg')).then(slogan => {
              if (slogan) slogan.style.animationDelay = -(performance.now() - started) + 'ms';
            });

            if (!ANIMATE_LOGO) {
              // Logo steht still -> nach einer Weile alles ausblenden
              at(STATIC_HOLD, () => splash.classList.add('fade-out'));
              at(STATIC_HOLD + SPLASH_FADE + 100, cleanUp);
              return;
            }

            if (!MORPH_INTO_BAR) {
              // Ringe fertig -> kurz stehen lassen, dann alles ausblenden
              at(RINGS_DONE + HOLD, () => splash.classList.add('fade-out'));
              at(RINGS_DONE + HOLD + SPLASH_FADE + 100, cleanUp);
              return;
            }

            // 1. Band hat die Grösse der Leiste -> gegen die (noch leere) Leiste tauschen
            at(BAND_DONE, () => {
              html.classList.remove('intro-hidden');
              document.getElementById('splash-band')?.remove();
            });
            // 2. Ringe fertig -> graue Punkte blenden ein, das Logo kurz danach aus
            const dots = RINGS_DONE;
            at(dots, () => html.classList.add('intro-dots'));
            at(dots + LOGO_DELAY, () => splash.classList.add('fade-logo'));
            // 3. Sobald das Logo weg ist, wächst der Tageskreis auf
            const thumb = dots + LOGO_DELAY + LOGO_FADE + THUMB_DELAY;
            at(thumb, () => html.classList.add('intro-thumb'));
            // 4. Minim später blendet die Wochenend-Markierung langsam ein
            const weekend = thumb + WEEKEND_DELAY;
            at(weekend, () => html.classList.add('intro-weekend'));
            // 5. Aufräumen, wenn alles fertig ist
            const end = Math.max(weekend + WEEKEND_FADE, thumb + THUMB_GROW, dots + LOGO_DELAY + LOGO_FADE);
            at(end + 100, cleanUp);
          })
          .catch(cleanUp);
      })();
    </script>

    <script>
      (g => {
        var h,
          a,
          k,
          p = 'The Google Maps JavaScript API',
          c = 'google',
          l = 'importLibrary',
          q = '__ib__',
          m = document,
          b = window;
        b = b[c] || (b[c] = {});
        var d = b.maps || (b.maps = {}),
          r = new Set(),
          e = new URLSearchParams(),
          u = () =>
            h ||
            (h = new Promise(async (f, n) => {
              await (a = m.createElement('script'));
              e.set('libraries', [...r] + '');
              for (k in g)
                e.set(
                  k.replace(/[A-Z]/g, t => '_' + t[0].toLowerCase()),
                  g[k]
                );
              e.set('callback', c + '.maps.' + q);
              a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
              d[q] = f;
              a.onerror = () => (h = n(Error(p + ' could not load.')));
              a.nonce = m.querySelector('script[nonce]')?.nonce || '';
              m.head.append(a);
            }));
        d[l]
          ? console.warn(p + ' only loads once. Ignoring:', g)
          : (d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)));
      })({
        v: 'weekly',
        key: 'AIzaSyBPJ23zg4onNgd-xRW23cN59KYTrAxZJRk',
      });
    </script>
  </body>
</html>
