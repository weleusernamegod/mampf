<strong class="title">Geöffnet am</strong>

<div id="open-days">
  <div class="circle" [class.active]="openDays?.monday"></div>
  <div class="day">Montag</div>

  <div class="circle" [class.active]="openDays?.tuesday"></div>
  <div class="day">Dienstag</div>

  <div class="circle" [class.active]="openDays?.wednesday"></div>
  <div class="day">Mittwoch</div>

  <div class="circle" [class.active]="openDays?.thursday"></div>
  <div class="day">Donnerstag</div>

  <div class="circle" [class.active]="openDays?.friday"></div>
  <div class="day">Freitag</div>

  <div class="circle" [class.active]="openDays?.saturday"></div>
  <div class="day">Samstag</div>

  <div class="circle" [class.active]="openDays?.sunday"></div>
  <div class="day">Sonntag</div>
</div>
