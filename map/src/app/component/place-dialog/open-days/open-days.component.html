<strong class="title">Öffnungszeiten</strong>

<div id="matrix" role="table" aria-label="Öffnungszeiten">
  <div role="row" class="row">
    <span role="columnheader"></span>
    @for (weekday of weekdays; track weekday.value) {
      <span
        role="columnheader"
        class="day"
        [class.current]="weekday.value === day"
        [attr.aria-label]="weekday.name"
        >{{ weekday.short }}</span
      >
    }
  </div>
  @for (slot of slots; track slot.value) {
    <div role="row" class="row">
      <span role="rowheader" class="slot">{{ slot.name }}</span>
      @for (weekday of weekdays; track weekday.value) {
        <span
          role="cell"
          class="cell"
          [class.current]="weekday.value === day"
          [attr.aria-label]="
            weekday.name + ' ' + slot.name + ': ' + (isOpen(weekday.value, slot.value) ? 'offen' : 'geschlossen')
          ">
          <span class="circle" [class.active]="isOpen(weekday.value, slot.value)"></span>
        </span>
      }
    </div>
  }
</div>
