<div id="wrapper">
  <div id="dialog" class="overlay">
    <div id="header">
      <!-- Logo mit Zufallsspruch (assets/slogan.js) -->
      <div #logo class="logo">
        <!-- Logo in der Oberflächenfarbe: die Datei dient nur als Form (Maske) -->
        <span class="logo-image" role="img" aria-label="mampf"></span>
      </div>
    </div>

    <!-- Ein Hinweis ersetzt kurz den Text der Zeile, damit nichts springt -->
    <ul id="actions">
      <li>
        <button type="button" class="action" (click)="share($event)">
          <span class="circle"><span class="icon icon-share"></span></span>
          <span class="text" [class.hint]="hint?.row === 'share'">
            {{ hint?.row === 'share' ? hint?.text : 'mit Freund:in teilen' }}
          </span>
        </button>
      </li>
      <li>
        <!-- Angemeldet: Panel "Meine Orte" über der Karte. Sonst zum Login, danach zurück zur Karte. -->
        @if (loggedIn) {
          <a class="action" routerLink="/meine-orte">
            <span class="circle"><span class="icon icon-edit"></span></span>
            <span class="text">meine Orte &amp; Konto</span>
          </a>
        } @else {
          <a class="action" routerLink="/anmelden" [queryParams]="{ zurueck: 'karte' }">
            <span class="circle"><span class="icon icon-person"></span></span>
            <span class="text">Login / Anmelden</span>
          </a>
        }
      </li>
      <li>
        <button type="button" class="action" (click)="showSoon($event, 'language')">
          <span class="circle language">de</span>
          <span class="text" [class.hint]="hint?.row === 'language'">
            {{ hint?.row === 'language' ? hint?.text : 'Sprache' }}
          </span>
        </button>
      </li>
      <li>
        <!--
          Farbregler: Antippen verbreitert den Punkt nach rechts zu einem Regler
          mit allen Farbtönen. Mit dem Finger wählen, beim Loslassen gilt die Farbe.
        -->
        <button
          type="button"
          class="action color-action"
          [class.picking]="picking"
          (click)="onColorRowClicked($event)">
          <span
            #hueBar
            class="circle color"
            role="slider"
            aria-label="Oberflächenfarbe"
            aria-valuemin="0"
            aria-valuemax="360"
            [attr.aria-valuenow]="previewHue"
            (pointerdown)="onHuePointerDown($event)"
            (pointermove)="onHuePointerMove($event)"
            (pointerup)="onHuePointerUp()"
            (pointercancel)="onHuePointerUp()">
            <span class="hue-scale"></span>
            <!-- Markierung beim Original-Grün, dort rastet der Regler ein -->
            <span class="hue-home" [style.--pos]="DEFAULT_HUE / 360"></span>
            <span
              class="hue-thumb"
              [style.--pos]="previewHue / 360"
              [style.background-color]="colorOf(previewHue)"></span>
          </span>
          <span class="text">Oberflächenfarbe</span>
        </button>
      </li>
    </ul>

    <div id="footer">
      <p class="links">
        <a (click)="$event.stopPropagation()">Nutzungsbedingungen</a> und
        <a (click)="$event.stopPropagation()">Datenschutzerklärung</a>
      </p>
      <p class="copyright">Copyright &copy; 2026 Yves Geiser · Version {{ version }}</p>
    </div>
  </div>
</div>
