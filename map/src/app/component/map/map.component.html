<google-map
  width="100%"
  height="100%"
  [center]="mapCenter"
  [zoom]="mapZoom"
  [options]="MAP_OPTIONS"
  (mapInitialized)="onMapInitialized($event)"
  (mapClick)="mapClicked.emit()">
  @if (positionReceived && positionIcon) {
    <map-circle
      [center]="accuracyCircleCenter"
      [radius]="accuracyCircleRadius"
      [options]="ACCURACY_CIRCLE_OPTIONS" />

    <map-marker
      [icon]="positionIcon"
      [position]="locationMarkerPosition"
      [clickable]="true"
      (mapClick)="locate()" />
  }
</google-map>

@if (placing) {
  <!-- Roter Punkt, immer genau in der Kartenmitte -->
  <div class="placing-pin" [class.moving]="mapMoving"><div class="dot"></div></div>
}
