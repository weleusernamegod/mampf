<div
  id="day-selector"
  class="overlay"
  #track
  role="slider"
  tabindex="0"
  aria-label="Wochentag"
  aria-valuemin="0"
  [attr.aria-valuemax]="days.length - 1"
  [attr.aria-valuenow]="index"
  [attr.aria-valuetext]="days[index].name"
  [class.dragging]="dragging"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  (lostpointercapture)="onPointerUp()"
  (keydown)="onKeyDown($event)">
  @for (day of days; track day.value) {
    <div
      class="wrapper"
      [class.wrapper-saturday]="day.value === 6"
      [class.wrapper-sunday]="day.value === 0">
      <div class="day"></div>
    </div>
  }

  <div
    class="thumb"
    [class.weekend]="days[index].weekend"
    [style.translate]="thumbX + 'px 0'">
    {{ days[index].label }}
  </div>
</div>
