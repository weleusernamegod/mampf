<main>
  <mampf-map
    id="map"
    [places]="visiblePlaces"
    [day]="selectedDay"
    [placing]="placing"
    (placeClicked)="onPlaceClicked($event)"
    (mapClicked)="onMapClicked()"></mampf-map>

  <div id="grid">
    <div>
      <mampf-navigation
        class="inline-block"
        [selectedCuisines]="selectedCuisines"
        (cuisineRemoved)="onCuisineRemoved($event)"
        (locateClicked)="onLocateClicked()"
        (filterClicked)="onFilterClicked()"
        (addClicked)="onAddClicked()"
        [aboutOpen]="aboutDialogVisible"
        [placing]="placing"
        (placeConfirmed)="onPlaceConfirmed()"
        (placeCancelled)="placing = false"
        (aboutClicked)="onAboutClicked()"
        (closeClicked)="aboutDialogVisible = false"></mampf-navigation>
    </div>
    <div>
      @if (aboutDialogVisible) {
        <mampf-about-dialog
          class="block full-height cursor-pointer"
          (click)="onAboutClicked()"></mampf-about-dialog>
      } @else if (filterDialogVisible) {
        <mampf-filter-dialog
          class="block full-height"
          [places]="places"
          [selectedCuisines]="selectedCuisines"
          (filterApplied)="onFilterApplied($event)"></mampf-filter-dialog>
      } @else if (placeDialogVisible) {
        <mampf-place-dialog
          class="block full-height"
          [place]="selectedPlace"
          (closed)="placeDialogVisible = false"></mampf-place-dialog>
      }
    </div>
    <div class="align-center">
      <!-- Im Platzieren-Modus ausgeblendet (bleibt aber erhalten, damit der Tag bleibt) -->
      <mampf-day-selector
        class="inline-block"
        [class.hidden]="placing"
        (daySelected)="onDaySelected($event)"></mampf-day-selector>
    </div>
  </div>
</main>
