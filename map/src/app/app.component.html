<main>
  <mampf-map
    id="map"
    [places]="visiblePlaces"
    [day]="selectedDay"
    [slots]="selectedSlots"
    [placing]="placing"
    (placeClicked)="onMapPlaceClicked($event)"
    (mapClicked)="onMapClicked()"></mampf-map>

  <div id="grid">
    <div>
      <mampf-navigation
        class="block"
        [selectedCategories]="selectedCategories"
        [selectedSlots]="selectedSlots"
        [selectedPrice]="selectedPrice"
        [categoryList]="categoryList"
        (slotsReset)="onSlotsReset()"
        (priceReset)="onPriceReset()"
        (categoryRemoved)="onCategoryRemoved($event)"
        (locateClicked)="onLocateClicked()"
        (filterClicked)="onFilterClicked()"
        (addClicked)="onAddClicked()"
        [placing]="placing"
        (aboutClicked)="onAboutClicked()"></mampf-navigation>
    </div>
    <div>
      @if (aboutDialogVisible) {
        <mampf-about-dialog
          class="block full-height cursor-pointer"
          (click)="onAboutClicked()"></mampf-about-dialog>
      } @else if (filterDialogVisible) {
        <mampf-filter-dialog
          class="block full-height"
          [places]="places"
          [categoryList]="categoryList"
          [selectedCategories]="selectedCategories"
          [selectedSlots]="selectedSlots"
          [selectedPrice]="selectedPrice"
          [day]="selectedDay"
          (filterApplied)="onFilterApplied($event)"></mampf-filter-dialog>
      } @else if (placeDialogVisible) {
        <mampf-place-dialog
          class="block full-height"
          [place]="selectedPlace"
          [startComment]="startComment"
          [day]="selectedDay"
          [categoryList]="categoryList"
          (closed)="placeDialogVisible = false"></mampf-place-dialog>
      }
      <!-- Admin-Panels (z.B. /meine-orte), siehe app.routes.ts -->
      <router-outlet
        (activate)="onPanelActivated($event)"
        (deactivate)="onPanelDeactivated()"></router-outlet>
    </div>
    <div class="align-center bottom">
      <!-- Im Platzieren-Modus ausgeblendet (bleibt aber erhalten, damit der Tag bleibt) -->
      <div class="selectors" [class.hidden]="placing">
        <mampf-day-selector
          class="inline-block"
          (daySelected)="onDaySelected($event)"></mampf-day-selector>
      </div>
      @if (placing) {
        <!-- Platzieren-Modus: unten statt oben beim "+", damit man nicht aus
             Versehen gleich weitertippt -->
        <div class="overlay place-bar">
          <button type="button" class="place-cancel" (click)="placing = false">Abbrechen</button>
          <button type="button" class="place-confirm" (click)="onPlaceConfirmed()">
            Ort erfassen
          </button>
        </div>
      }
    </div>
  </div>
</main>
