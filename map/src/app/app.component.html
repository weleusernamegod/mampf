<main>
  <mampf-map
    id="map"
    [places]="filteredPlaces"
    (placeClicked)="onPlaceClicked($event)"></mampf-map>

  <div id="grid">
    <div>
      <mampf-navigation
        class="inline-block"
        (aboutClicked)="onAboutClicked()"
        (addClicked)="onAddClicked()"
        (locateClicked)="onLocateClicked()"></mampf-navigation>
    </div>
    <div>
      @if (aboutDialogVisible) {
        <mampf-about-dialog
          class="block full-height cursor-pointer"
          (click)="onAboutClicked()"></mampf-about-dialog>
      } @else if (placeDialogVisible) {
        <mampf-place-dialog
          class="block full-height"
          [place]="selectedPlace"></mampf-place-dialog>
      }
    </div>
    <div class="align-center">
      <mampf-day-selector
        class="inline-block"
        (daySelected)="onDaySelected($event)"></mampf-day-selector>
    </div>
  </div>
</main>
