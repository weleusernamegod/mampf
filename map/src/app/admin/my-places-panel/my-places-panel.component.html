<div id="wrapper">
  <div id="dialog" class="overlay">
    <!-- Titel und Konto-Links bleiben oben stehen, nur die Liste scrollt -->
    <div id="header">
      <h2>Meine Orte</h2>
      <div class="header-links">
        <a routerLink="/profil">Profil</a>
        @if (isAdmin) {
          <a routerLink="/kategorien">Kategorien</a>
        }
        <a href="/api/get-logout.php">Abmelden</a>
      </div>
    </div>

    <div id="content">
      @if (places === undefined) {
        <p class="info">Wird geladen …</p>
      } @else if (loadError) {
        <p class="info">Die Orte konnten nicht geladen werden.</p>
      } @else {
        <ul id="places">
          @for (place of places; track place.id) {
            <li>
              <button
                type="button"
                class="place"
                (click)="onPlaceClicked(place)">
                <img
                  [src]="pictureUrl(place)"
                  alt=""
                  width="44"
                  height="44"
                  (error)="onPictureError($event)" />
                <span class="text">
                  <span class="name">{{ place.name }}</span>
                  <span class="description">{{ place.description }}</span>
                </span>
              </button>
              <a
                class="edit"
                [routerLink]="['/ort', place.id]"
                title="bearbeiten">
                <span class="icon-edit"></span>
              </a>
            </li>
          } @empty {
            <li class="info">Du hast noch keine Orte erfasst.</li>
          }
        </ul>
      }
    </div>

    <div id="footer">
      <button type="button" class="text-button" (click)="onCloseClicked()">
        Schliessen
      </button>
      <button type="button" class="primary-button" (click)="onAddClicked()">
        Neuer Ort
      </button>
    </div>
  </div>
</div>
