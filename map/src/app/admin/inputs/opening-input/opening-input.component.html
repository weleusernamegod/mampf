<div class="week" role="grid" aria-label="Öffnungszeiten">
  <!-- Kopfzeile: Wochentage (Klick = ganze Spalte) -->
  <span></span>
  @for (day of weekdays; track day.value) {
    <button
      type="button"
      class="day"
      [class.active]="isDayOpen(day.value)"
      [title]="day.name + ': ganzen Tag umschalten'"
      (click)="toggleDay(day.value)">
      {{ day.short }}
    </button>
  }

  <!-- Eine Zeile pro Tageszeit (Klick auf den Namen = ganze Zeile) -->
  @for (slot of slots; track slot.value) {
    <button
      type="button"
      class="slot"
      [title]="slot.name + ': jeden Tag umschalten'"
      (click)="toggleSlot(slot.value)">
      {{ slot.name }}
    </button>
    @for (day of weekdays; track day.value) {
      <button
        type="button"
        class="check"
        [class.selected]="isOpen(day.value, slot.value)"
        [attr.aria-pressed]="isOpen(day.value, slot.value)"
        [attr.aria-label]="day.name + ' ' + slot.name"
        (click)="toggle(day.value, slot.value)">
        @if (isOpen(day.value, slot.value)) {
          <span class="tick"></span>
        }
      </button>
    }
  }
</div>
