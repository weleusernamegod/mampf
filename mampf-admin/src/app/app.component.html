@if (user) {
  <nav class="topbar">
    <div class="topbar-inner">
      <!-- Logo führt zurück zur Karte (Startseite) -->
      <a class="brand" href="/" title="Zur Karte">
        <span class="mampf-logo" role="img" aria-label="mampf"></span>
      </a>
      <a routerLink="/my-places" routerLinkActive="active" class="nav-link">Meine Orte</a>
      @if (user.admin) {
        <a routerLink="/categories" routerLinkActive="active" class="nav-link">Kategorien</a>
      }
      <a routerLink="/profile" routerLinkActive="active" class="nav-link">Profil</a>
      <button type="button" class="nav-link sign-out" (click)="onSignOutClicked()">
        Abmelden
      </button>
    </div>
  </nav>

  <main class="container">
    <router-outlet></router-outlet>
  </main>
} @else {
  <mampf-loading-spinner></mampf-loading-spinner>
}
