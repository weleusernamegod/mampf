<div class="card mb-3">
  <div class="row g-0">
    <div class="col-auto">
      <img
        [src]="imageUrl ? imageUrl : 'assets/no-picture.jpg'"
        class="img-fluid rounded-start"
        alt="..." />
    </div>
    <div class="col">
      <div class="card-body">
        <p class="card-title"><strong>Main Picture</strong></p>
        @if (imageUrl) {
          <button
            type="button"
            class="btn btn-danger"
            (click)="onPictureDeleted()">
            Delete
          </button>
        } @else {
          <div class="mt-3 custom-file">
            <input
              type="file"
              class="custom-file-input"
              (change)="onFileSelected($event)" />
          </div>
        }
      </div>
    </div>
  </div>
</div>
