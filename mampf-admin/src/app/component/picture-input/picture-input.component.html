<div class="picture">
  <img [src]="imageUrl ? imageUrl : 'assets/no-picture.jpg'" alt="" />
  <div class="actions">
    @if (imageUrl) {
      <button type="button" class="chip danger" (click)="onPictureDeleted()">
        <i class="fa fa-trash-o"></i>Bild entfernen
      </button>
    } @else {
      <!-- Eigener Knopf statt dem Datei-Feld des Browsers (das wäre je nach Browser englisch) -->
      <label class="chip">
        <i class="fa fa-upload"></i>Bild auswählen
        <input type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
      </label>
      <p class="hint">Am besten quadratisch.</p>
    }
  </div>
</div>
