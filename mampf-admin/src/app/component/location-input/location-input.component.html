<p class="mb-1"><strong>Location</strong></p>
<p>
  <small
    >Drag the <i class="fa fa-map-marker"></i> marker to change location.</small
  >
</p>

<google-map
  width="100%"
  height="500"
  [options]="MAP_OPTIONS"
  [center]="currentLocation"
  [zoom]="15">
  <map-marker
    [position]="currentLocation"
    [options]="{ draggable: true }"
    (mapDragend)="onMarkerLocationChanged($event)" />
</google-map>
