<div class="map">
  <google-map
    width="100%"
    [height]="height"
    [options]="MAP_OPTIONS"
    [center]="center"
    [zoom]="16">
    <map-marker
      [position]="currentLocation"
      [options]="markerOptions"
      (mapDragend)="onMarkerLocationChanged($event)" />
  </google-map>
</div>
