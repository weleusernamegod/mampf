<form class="page" ngNativeValidate (submit)="$event.preventDefault(); onSave()">
  <section class="panel">
    <h2 class="panel-title">Profil</h2>

    <label class="question" for="input-name">Dein Name</label>
    <div class="name-row">
      <input
        type="text"
        minlength="2"
        maxlength="30"
        required
        class="field"
        id="input-name"
        name="name"
        autocomplete="nickname"
        placeholder="z.B. Knusprige Bratwurst"
        [(ngModel)]="name"
        (ngModelChange)="message = undefined" />
      <button type="button" class="random" (click)="onRandomName()" title="Zufälligen Namen erzeugen">
        🎲 Zufällig
      </button>
    </div>
    <p class="hint">Wird bei deinen Kommentaren auf der Karte angezeigt, auch bei den bisherigen.</p>

    <span class="question">E-Mail</span>
    <p class="mail">{{ mail }} <span class="hint-inline">(wird nie angezeigt)</span></p>

    <div class="actions">
      @if (message) {
        <span class="hint" [class.error]="message.error">{{ message.text }}</span>
      }
      <button type="submit" class="save" [disabled]="!changed || saving">
        {{ saving ? 'Speichere …' : 'Speichern' }}
      </button>
    </div>
  </section>
</form>
