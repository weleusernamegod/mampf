<h1 class="mb-4">Meine Orte</h1>

@if (myPlaces) {
  <table class="table table-hover">
    <thead>
      <tr>
        <th scope="col" width="70"></th>
        <th scope="col">Name</th>
        <th scope="col">Beschreibung</th>
        <th scope="col" width="55"></th>
      </tr>
    </thead>
    <tbody class="align-middle cursor-pointer">
      @for (place of myPlaces; track place.id) {
        <tr (click)="onPlaceClicked(place)">
          <td>
            <img
              [src]="getPictureUrl(place.pictureId)"
              class="rounded float-left"
              width="50"
              height="50" />
          </td>
          <td>{{ place.name }}</td>
          <td>{{ place.description }}</td>
          <td>
            <button
              type="button"
              class="btn btn-danger"
              (click)="$event.stopPropagation(); onPlaceDeleteClicked(place)">
              <i class="fa fa-trash-o"></i>
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Noch keine Orte erfasst</td>
        </tr>
      }
    </tbody>
  </table>

  <div class="mt-4 text-end">
    <button type="button" class="btn btn-primary" (click)="onAddClicked()">
      <i class="fa fa-plus"></i> Neuer Ort
    </button>
  </div>
} @else {
  <mampf-loading-spinner></mampf-loading-spinner>
}

<mampf-action-status-modal
  [title]="'Ort wird gelöscht'"
  [status]="actionStatus"></mampf-action-status-modal>
