<h1 class="mb-4">My Places</h1>

@if (myPlaces) {
  <table class="table table-hover">
    <thead>
      <tr>
        <th scope="col" width="70"></th>
        <th scope="col">Name</th>
        <th scope="col">Description</th>
      </tr>
    </thead>
    <tbody class="align-middle cursor-pointer">
      @if (myPlaces.length === 0) {
        <tr>
          <td colspan="3">No entries available</td>
        </tr>
      } @else {
        @for (place of myPlaces; track place.id) {
          <tr (click)="onPlace(place)">
            <td>
              <img
                [src]="getPictureUrl(place.pictureId)"
                class="rounded float-left"
                width="50"
                height="50" />
            </td>
            <td>{{ place.name }}</td>
            <td>{{ place.description }}</td>
          </tr>
        }
      }
    </tbody>
  </table>
} @else {
  <mampf-loading-spinner></mampf-loading-spinner>
}
